apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-dashboard-config
  namespace: k8s-dashboard
  labels:
    app.kubernetes.io/name: k8s-dashboard
data:
  # 服务器配置
  PORT: "9099"
  TZ: "Asia/Shanghai"

  # PostgreSQL 配置（可选；未配置时自动使用 SQLite）
  POSTGRES_DSN: ""
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "k8s_dashboard"
  POSTGRES_USER: "postgres"
  POSTGRES_SSLMODE: "disable"

  # SQLite 配置
  SQLITE_PATH: "/var/lib/k8s-dashboard/dashboard.db"
  ALLOW_SQLITE_FALLBACK: "true"
  MULTI_CLUSTER_ENABLED: "true"

  # Alertmanager 默认关闭。启用时必须同时设置 ALERTMANAGER_URL。
  ALERTMANAGER_ENABLED: "false"
  ALERTMANAGER_URL: ""

  # 审计日志配置
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_MAX_SIZE: "100"
  AUDIT_LOG_MAX_AGE: "30"
  AUDIT_LOG_MAX_BACKUPS: "10"

  # 日志级别
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
